<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OoT Bingo Popout</title>
</head>
<body>
<!--
  Stream popout — a vertical strip that sits beside a 4:3 Ocarina of Time capture in a 16:9 canvas.

  Geometry: at 1920x1080 the game fills 1440x1080, leaving a 480px column. That is the shape this
  page is designed for (4:9), though everything is expressed in viewport units so it survives being
  resized. The bottom of the column is left empty on purpose — that is where a streamer's chat
  widget goes, as in the layout this was modelled on.

  Readability is the whole point, so it differs from ootbingo's popout in four ways:
    * every goal is set at ONE size, chosen by binary search so the LONGEST goal still fits. Sizing
      each cell independently wins a few points on short goals but makes the column look ragged and
      implies the big ones matter more.
    * item icons are drawn at 3-4x with image-rendering:pixelated. They are 32px pixel-art sprites,
      so nearest-neighbour is what they were drawn for; smoothing them just makes them muddy.
    * the goal text is never hidden. ootbingo's tracker can replace the text with icons alone
      (hideText); on a stream the viewer has no way to hover and find out what the icons meant.
    * state is a glyph and a border as well as a colour, so it survives a colourblind viewer and a
      badly calibrated stream encoder.
-->
<style>
:root {
  --ink: #14111c;
  --paper: #edebf2;
  --amethyst: #8e6fe9;

  --bg: var(--ink);
  --bg-slab: #1b1726;
  --bg-cell: #241f33;
  --surface: #1e1a2a;
  --fg: #ece9f4;
  --fg-muted: #a49bbb;
  --fg-faint: #887f9f;
  --rule: #2e2840;
  --rule-strong: #6e5f98;
  --accent: var(--amethyst);
  --accent-soft: #1a152b;
  --accent-fg: #14111c;
  --gain: #4fd0a8;
  --gain-soft: #123329;
  --loss: #f0805f;
  --loss-soft: #37190f;
  --perm: #dfae54;
  --perm-soft: #302512;
  --focus: #a98cf5;

  --mono: "Cascadia Mono", "SF Mono", ui-monospace, "Segoe UI Mono", Menlo, Consolas, monospace;
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;

  /* set from the URL at boot; these are the defaults */
  --chat: 28%;
  --pad: 0.8vh;
}

/* The popout is dark by default because a stream overlay nearly always is, but the light palette is
   here so the same contrast gate runs over both — and so anyone compositing onto a light scene has
   a real option rather than an inverted guess. */
:root[data-theme="light"] {
  --bg: var(--paper); --bg-slab: #e3e0ec; --bg-cell: #d8d4e4; --surface: #f7f6fa;
  --fg: #1b1725; --fg-muted: #5d566f; --fg-faint: #68607c;
  --rule: #cbc5d9; --rule-strong: #8579a8;
  --accent: #6742c9; --accent-soft: #ece5fb; --accent-fg: #ffffff;
  --gain: #137154; --gain-soft: #d9f2e9;
  --loss: #af401e; --loss-soft: #fbe3db;
  --perm: #815f18; --perm-soft: #f6ecd4;
  --focus: #6742c9;
}
:root[data-theme="dark"] {
  --bg: var(--ink); --bg-slab: #1b1726; --bg-cell: #241f33; --surface: #1e1a2a;
  --fg: #ece9f4; --fg-muted: #a49bbb; --fg-faint: #887f9f;
  --rule: #2e2840; --rule-strong: #6e5f98;
  --accent: var(--amethyst); --accent-soft: #1a152b; --accent-fg: #14111c;
  --gain: #4fd0a8; --gain-soft: #123329;
  --loss: #f0805f; --loss-soft: #37190f;
  --perm: #dfae54; --perm-soft: #302512;
  --focus: #a98cf5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: var(--ink); --bg-slab: #1b1726; --bg-cell: #241f33; --surface: #1e1a2a;
    --fg: #ece9f4; --fg-muted: #a49bbb; --fg-faint: #887f9f;
    --rule: #2e2840; --rule-strong: #6e5f98;
    --accent: var(--amethyst); --accent-soft: #1a152b; --accent-fg: #14111c;
    --gain: #4fd0a8; --gain-soft: #123329;
    --loss: #f0805f; --loss-soft: #37190f;
    --perm: #dfae54; --perm-soft: #302512;
    --focus: #a98cf5;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  /* a stray scrollbar would eat into a column this narrow and shift every measurement */
  overflow: hidden;
}

.pop { height: 100vh; display: flex; flex-direction: column; }

/* ---------- header ---------- */
.head {
  flex: 0 0 auto;
  padding: var(--pad) 0.6rem;
  border-bottom: 2px solid var(--rule-strong);
  background: var(--bg-slab);
  display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem;
}
.head .who {
  font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--accent); font-size: clamp(0.8rem, 2.1vh, 1.4rem);
}
.head .meta {
  font-family: var(--mono); color: var(--fg-muted);
  font-size: clamp(0.6rem, 1.4vh, 0.95rem); white-space: nowrap;
}
.pop.nohead .head { display: none; }

/* ---------- goals ---------- */
.goals { flex: 1 1 auto; min-height: 0; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; }
.sq {
  flex: 1 1 0; min-height: 0;
  border-bottom: 1px solid var(--rule);
  padding: var(--pad) 0.5rem;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.4vh;
  position: relative;
  background: var(--bg);
  cursor: pointer;
  /* the strip is captured, not read up close; a hairline between squares is not enough separation */
  border-left: 0.45rem solid transparent;
}
.sq:last-child { border-bottom: none; }

.sqtext {
  width: 100%; flex: 1 1 auto; min-height: 0; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
/* The text lives in its own element rather than directly in the centring flex box. Centred overflow
   spills equally above and below, and scrollHeight only ever reports the part below the bottom
   edge — so measuring the flex container reported half the real overflow and the fit settled on a
   size that clipped. Measuring this inner box instead gives the true height. */
.sqinner {
  text-align: center;
  font-weight: 700; line-height: 1.08; letter-spacing: 0.005em;
  overflow-wrap: break-word; max-width: 100%;
}

/* Done is the only state, so it does not need a glyph to tell it apart from a second marked state —
   it needs to be unmistakable against UNMARKED. Three channels change at once: the ground lightens,
   the left bar lights up, and the text turns. That is a lightness and structure difference, not a
   hue a colourblind viewer or a low-bitrate encoder could lose. */
.sq[data-state="done"] { background: var(--gain-soft); border-left-color: var(--gain); }
.sq[data-state="done"] .sqtext { color: var(--gain); }

/* ---------- item tracker ---------- */
.track { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 0.3vh; }
.tokens { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.35rem; }
.tok {
  width: var(--icon); height: var(--icon);
  background: none; border: 0; padding: 0; cursor: pointer;
  image-rendering: pixelated;
  /* an unowned item reads as "not yet", so it is dimmed rather than hidden — the row still tells
     you how many there are and which ones they are */
  opacity: 0.28; filter: grayscale(1);
  transition: opacity 0.12s linear, filter 0.12s linear;
}
.tok[data-on="1"] { opacity: 1; filter: none; }
/* Right-clicked away. ootbingo drops the token out of the flow rather than dimming it, so a
   row of six songs becomes a row of four and the strip stays honest about what is left. */
.tok.gone { display: none; }
.counter { display: flex; align-items: center; gap: 0.4rem; }
.counter img { width: var(--icon); height: var(--icon); image-rendering: pixelated; }
.cnum {
  font-family: var(--mono); font-weight: 700; color: var(--fg);
  font-size: clamp(1rem, 3.4vh, 2.2rem); line-height: 1;
}
.cnum .den { color: var(--fg-muted); }
.counter button { background: none; border: 0; padding: 0; cursor: pointer; line-height: 0; }
.tok:focus-visible, .counter button:focus-visible, .sq:focus-visible, .timer:focus-visible {
  outline: 3px solid var(--focus); outline-offset: 2px;
}

/* ---------- timer ---------- */
.timer {
  flex: 0 0 auto;
  border-top: 2px solid var(--rule-strong);
  background: var(--bg-slab);
  padding: 0.6vh 0.4rem;
  text-align: center; cursor: pointer;
  font-family: var(--mono); font-weight: 700;
  font-size: clamp(1.2rem, 5vh, 3.4rem); line-height: 1.1;
  color: var(--perm);
  font-variant-numeric: tabular-nums;
}
/* Running vs stopped must be legible at a glance without reading the digits change, so the label
   below the clock says which it is in words. */
.timer .tstate {
  display: block; font-family: var(--sans); font-weight: 600;
  font-size: clamp(0.55rem, 1.4vh, 0.9rem); letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--fg-muted);
}
.timer[data-running="1"] { color: var(--gain); }
.pop.notimer .timer { display: none; }

/* ---------- chat reserve ---------- */
/* Deliberately empty. The streamer's chat widget is composited over this region, so anything drawn
   here would end up underneath it. */
.chatspace { flex: 0 0 var(--chat); background: var(--bg); }
.chatspace.hint {
  border-top: 1px dashed var(--rule);
  display: flex; align-items: center; justify-content: center;
  color: var(--fg-faint); font-size: clamp(0.6rem, 1.5vh, 0.9rem);
  letter-spacing: 0.12em; text-transform: uppercase;
}

.err {
  padding: 1rem; color: var(--loss); background: var(--loss-soft);
  font-size: 1rem; line-height: 1.5;
}
.err code { font-family: var(--mono); color: var(--fg); overflow-wrap: break-word; }
</style>

<div class="pop" id="pop">
  <div class="head" id="head">
    <span class="who" id="who">Row</span>
    <span class="meta" id="meta"></span>
  </div>
  <ol class="goals" id="goals"></ol>
  <div class="timer" id="timer" role="button" tabindex="0"
       aria-label="Stopwatch. Click or press space to start and pause, press R to reset.">
    <span id="tval">00:00:00.0</span>
    <span class="tstate" id="tstate">stopped</span>
  </div>
  <div class="chatspace" id="chatspace" aria-hidden="true"></div>
</div>

  var LINES = {
    row1: [0, 1, 2, 3, 4], row2: [5, 6, 7, 8, 9], row3: [10, 11, 12, 13, 14],
    row4: [15, 16, 17, 18, 19], row5: [20, 21, 22, 23, 24],
    col1: [0, 5, 10, 15, 20], col2: [1, 6, 11, 16, 21], col3: [2, 7, 12, 17, 22],
    col4: [3, 8, 13, 18, 23], col5: [4, 9, 14, 19, 24],
    tlbr: [0, 6, 12, 18, 24],
    /* ootbingo emits BL-TR bottom-left first (board.map(row[4-j]).reverse()), so match that or a
       pasted popout and a generated one would disagree about which square is number 1. */
    bltr: [20, 16, 12, 8, 4]
  };

  /* The seed line in the top right is display only. It is shown whenever a seed is in the URL, even
     when the squares were passed by name — the goal index opens the popout that way to guarantee the
     order matches what is on screen there, and losing the seed off the header along with it would
     leave a strip nobody can trace back to a board. */
  function metaLabel() {
    var seed = qs.get("seed");
    /* The seed only. The mode is still read for generation, but naming it here spends header room
       on something a viewer cannot act on — the seed is the part worth reading off a stream. */
    return seed ? "seed " + seed : "";
  }

  function resolveGoals() {
    var direct = qs.getAll("goal");
    if (direct.length) {
      // explicit squares win over a seed that is also present: it is there for the label, not to regenerate
      return { title: qs.get("title") || "Row", names: direct, meta: metaLabel() };
    }
    var seed = qs.get("seed");
    if (!seed) return null;
    var version = qs.get("version") || BOARD.defaultVersion;
    var mode = qs.get("mode") || "normal";
    var lineKey = (qs.get("line") || "row1").toLowerCase().replace(/[^a-z0-9]/g, "");
    var idx = LINES[lineKey];
    if (!idx) return { error: 'Unknown line "' + lineKey + '". Use row1-row5, col1-col5, tlbr or bltr.' };
    var pack = BOARD.versions[version];
    if (!pack) {
      return { error: 'Unknown version "' + version + '". This build carries ' + Object.keys(BOARD.versions).join(", ") + "." };
    }
    if (!pack[mode]) {
      return { error: 'v' + version + ' has no "' + mode + '" goal list. Try normal or short.' };
    }
    var card;
    try {
      // seed stays a string: seedrandom keys on seed.toString(), so "007" and 7 are different boards
      card = window.BingoLibrary.generateBingoBoard(pack, mode, seed);
    } catch (e) {
      return { error: "Could not generate that board: " + e.message };
    }
    if (!card) return { error: "The generator could not build a board for seed " + seed + "." };
    var squares = card.squares;
    return {
      title: lineKey.toUpperCase().replace(/^(ROW|COL)(\d)$/, "$1 $2").replace("TLBR", "TL-BR").replace("BLTR", "BL-TR"),
      // a square is { difficulty, desiredTime, goal }, so the name is a level down
      names: idx.map(function (i) { return squares[i].goal.name; }),
      meta: metaLabel()
    };
  }

  /* ---------- item tracker ----------
     A direct port of ootbingo's lib/item-tracker: trackerDefaults says whether a goal gets tokens,
     a counter, or nothing, and the first matching regex in the ORDERED trackerData list supplies
     the icons. Order matters — /(\d+).*Skulltulas/ must lose to /(\d+).*different Skulltulas/. */
  function trackerFor(goal) {
    var setting = DEFAULTS[goal];
    var mode = (setting && typeof setting === "object") ? setting.mode : setting;
    if (!mode || mode === "none") return null;
    for (var i = 0; i < RULES.length; i++) {
      var r = RULES[i];
      var m = new RegExp(r.re, r.fl).exec(goal);
      if (!m) continue;
      if (mode === "tokens") {
        var rows = r.rows;
        if (!rows) {
          var n = +m[1];
          if (!(n > 0) || !r.tokenIcon) return null;
          rows = [[]];
          for (var k = 0; k < n; k++) rows[0].push({ icon: r.tokenIcon, on: false });
        }
        return { mode: "tokens", rows: rows };
      }
      if (mode === "counter") {
        var den = r.denominator || +m[1];
        if (!(den > 0) || !r.counterIcon) return null;
        return { mode: "counter", icon: r.counterIcon, den: den };
      }
      return null;
    }
    return null;
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* ---------- persistence ----------
     An OBS browser source reloads whenever the scene is re-added or the machine restarts mid-race.
     Losing the ticks and the marks at that moment would be worse than not having them, so both are
     stored against a key derived from the actual squares. */
  var store = {
    key: "sohtools.popout.",
    get: function (k, d) {
      try { var v = localStorage.getItem(this.key + k); return v == null ? d : JSON.parse(v); }
      catch (e) { return d; }
    },
    set: function (k, v) {
      try { localStorage.setItem(this.key + k, JSON.stringify(v)); } catch (e) { /* private mode */ }
    }
  };

  function hash(str) {
    var h = 5381;
    for (var i = 0; i < str.length; i++) h = ((h * 33) ^ str.charCodeAt(i)) >>> 0;
    return h.toString(36);
  }

  /* ---------- render ---------- */
  var pop = document.getElementById("pop");
  var goalsEl = document.getElementById("goals");
  var spec = resolveGoals();

  if (!spec || spec.error) {
    pop.innerHTML = "";
    var e = el("div", "err");
    e.appendChild(el("p", null, spec && spec.error ? spec.error : "Nothing to show."));
    var help = el("p");
    help.appendChild(document.createTextNode("Add either "));
    help.appendChild(el("code", null, "?seed=523297&line=row1"));
    help.appendChild(document.createTextNode(" or an ootbingo popout query "));
    help.appendChild(el("code", null, "?title=ROW1&goal=…&goal=…"));
    help.appendChild(document.createTextNode("."));
    e.appendChild(help);
    pop.appendChild(e);
    return;
  }

  /* Deliberately constant, and deliberately not built from the line. OBS Window Capture matches on
     the window title, so a title carrying "COL1" or "BL-TR" would stop matching the moment the
     streamer switched lines — the source silently goes blank mid-race. The line is named in the
     header instead, where a viewer can actually read it. Do not interpolate anything into this. */
  document.title = "OoT Bingo Popout";
  document.getElementById("who").textContent = spec.title;
  document.getElementById("meta").textContent = spec.meta || "";

  var boardKey = hash(spec.title + "|" + spec.names.join("|"));
  var marks = store.get("marks." + boardKey, {});

  /* Icon size scales with how much room a square actually has: five squares in a 1080px column with
     no chat reserve leaves far more height than nine squares with one. */
  var ICON_STEPS = ["clamp(18px, 4.4vh, 54px)", "clamp(16px, 3.4vh, 42px)", "clamp(14px, 2.6vh, 32px)"];

  var textNodes = [];
  spec.names.forEach(function (name, i) {
    var li = el("li", "sq");
    li.dataset.state = marks[i] === "done" ? "done" : "none";
    li.tabIndex = 0;
    li.setAttribute("role", "button");   // a toggle: aria-pressed is set in paint()

    var t = el("div", "sqtext");
    var inner = el("div", "sqinner", name);
    t.appendChild(inner);
    li.appendChild(t);
    textNodes.push({ box: t, text: inner });

    var tr = trackerFor(name);
    if (tr && qs.get("icons") !== "0") {
      var wrap = el("div", "track");
      if (tr.mode === "tokens") {
        tr.rows.forEach(function (row) {
          var r = el("div", "tokens");
          row.forEach(function (tok) {
            if (!ICONS[tok.icon]) return;
            var b = el("button", "tok");
            b.type = "button";
            b.style.backgroundImage = "url(" + ICONS[tok.icon] + ")";
            b.style.backgroundSize = "100% 100%";
            b.dataset.on = tok.on ? "1" : "0";
            b.setAttribute("aria-label", tok.icon);
            b.setAttribute("aria-pressed", tok.on ? "true" : "false");
            b.addEventListener("click", function (ev) {
              ev.stopPropagation();
              var on = b.dataset.on === "1" ? "0" : "1";
              b.dataset.on = on;
              b.setAttribute("aria-pressed", on === "1" ? "true" : "false");
            });
            /* Right-click removes the token, matching ootbingo's tracker: a goal like
               "6 Songs" lists every candidate, and a racer prunes the ones the row will not use
               so the strip shows only what is still live. Right-clicking the square puts them
               back. stopPropagation keeps it off the square's own handler. */
            b.addEventListener("contextmenu", function (ev) {
              ev.preventDefault();
              ev.stopPropagation();
              b.classList.add("gone");
            });
            r.appendChild(b);
          });
          if (r.childNodes.length) wrap.appendChild(r);
        });
      } else {
        var c = el("div", "counter");
        var btn = el("button");
        btn.type = "button";
        var img = document.createElement("img");
        img.src = ICONS[tr.icon];
        img.alt = "";
        btn.appendChild(img);
        var num = el("span", "cnum");
        var cur = 0;
        var val = el("span", null, "0");
        var den = el("span", "den", " / " + tr.den);
        num.appendChild(val); num.appendChild(den);
        btn.setAttribute("aria-label", "count for " + name);
        function bump(d) {
          cur += d;
          if (cur > tr.den) cur = 0;
          if (cur < 0) cur = 0;   // ootbingo clamps here rather than wrapping to the maximum
          val.textContent = String(cur);
        }
        btn.addEventListener("click", function (ev) { ev.stopPropagation(); bump(1); });
        btn.addEventListener("contextmenu", function (ev) { ev.preventDefault(); ev.stopPropagation(); bump(-1); });
        c.appendChild(btn); c.appendChild(num);
        wrap.appendChild(c);
      }
      if (wrap.childNodes.length) li.appendChild(wrap);
    }

    function paint() {
      var done = li.dataset.state === "done";
      li.setAttribute("aria-pressed", done ? "true" : "false");
      li.setAttribute("aria-label", name + (done ? " — done" : ""));
    }
    paint();
    function toggle() {
      li.dataset.state = li.dataset.state === "done" ? "none" : "done";
      marks[i] = li.dataset.state;
      store.set("marks." + boardKey, marks);
      paint();
    }
    li.addEventListener("click", toggle);
    li.addEventListener("contextmenu", function (ev) {
      /* The undo for the token removal above. A token's own handler stops propagation, so this
         only runs on the square itself. */
      var gone = li.querySelectorAll(".tok.gone");
      if (!gone.length) return;
      ev.preventDefault();
      Array.prototype.forEach.call(gone, function (t) { t.classList.remove("gone"); });
    });
    li.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggle(); }
    });
    goalsEl.appendChild(li);
  });

  /* ---------- layout from the URL ---------- */
  var chat = qs.get("chat");
  if (chat != null) {
    var pct = parseFloat(chat);
    if (isFinite(pct) && pct >= 0 && pct <= 90) document.documentElement.style.setProperty("--chat", pct + "%");
  }
  if (qs.get("chathint") === "1") {
    /* Only for scene setup: it draws the reserved band so a streamer can see where to drop the chat
       widget. The styling centres a label, so it needs one — without text it was an unexplained
       dashed line. Leave it off for the live layout. */
    var cs = document.getElementById("chatspace");
    cs.classList.add("hint");
    cs.textContent = "chat goes here";
  }
  if (qs.get("head") === "0") pop.classList.add("nohead");
  if (qs.get("timer") !== "1") pop.classList.add("notimer");
  var theme = qs.get("theme");
  if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);

  /* ---------- one type size for the whole column ----------
     Binary search the largest size at which EVERY goal still fits its box, then apply it to all of
     them. Fitting each square separately would let short goals run much larger, but a column whose
     type size jumps around is harder to read at a glance and makes the big ones look important. */
  function fitsAt(px) {
    textNodes.forEach(function (n) { n.text.style.fontSize = px + "px"; });
    return textNodes.every(function (n) {
      return n.text.getBoundingClientRect().height <= n.box.clientHeight
        && n.text.scrollWidth <= n.box.clientWidth + 1;
    });
  }

  function fitAll() {
    if (!textNodes.length) return 0;
    var lo = 8, hi = 96;
    if (fitsAt(hi)) { lo = hi; }
    else {
      for (var pass = 0; pass < 14; pass++) {
        var mid = (lo + hi) / 2;
        if (fitsAt(mid)) lo = mid; else hi = mid;
      }
    }
    var size = Math.floor(lo * 100) / 100;   // never round UP past the size that was measured
    fitsAt(size);
    return size;
  }

  /* Icons take height away from the text, so the two settle together: pick an icon step, refit,
     and step the icons down if the text ends up too small to read on a stream. */
  function layout() {
    for (var s = 0; s < ICON_STEPS.length; s++) {
      document.documentElement.style.setProperty("--icon", ICON_STEPS[s]);
      var size = fitAll();
      if (size >= 20 || s === ICON_STEPS.length - 1) break;
    }
  }
  layout();
  window.addEventListener("resize", layout);
  /* Web fonts and the decoded icons both change metrics after first paint. */
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
  window.addEventListener("load", layout);

  /* ---------- stopwatch ----------
     Driven by requestAnimationFrame, not by a 100 ms interval. Sampling a tenths-of-a-second
     display once per tenth is a beat: setInterval fires at ">= delay" with jitter, so the phase
     against the tenth boundary wanders and roughly one tenth in thirty is skipped outright while
     others render twice. That is the choppiness. rAF samples at the compositor's rate — the
     browser's 60 Hz, or an OBS source's configured fps — so every tenth lands within one frame of
     when it should, and the DOM is only touched when the string actually changes, which keeps the
     real repaint count the same as before.

     Time comes from performance.now() while running, because Date.now() jumps if the system clock
     is corrected mid-race. The stored record still keeps wall time, since performance.now() restarts
     at zero on reload and the clock has to survive an OBS source restarting. */
  var timerEl = document.getElementById("timer");
  var tval = document.getElementById("tval");
  var tstate = document.getElementById("tstate");
  var t = store.get("timer", { running: false, base: 0, since: 0 });

  var anchorPerf = 0, anchorMs = 0;
  function anchor() {
    anchorPerf = performance.now();
    // a stored clock that was running keeps counting across the reload, via wall time
    anchorMs = t.base + (t.running ? Math.max(0, Date.now() - t.since) : 0);
  }
  anchor();

  function elapsed() { return t.running ? anchorMs + (performance.now() - anchorPerf) : t.base; }

  function fmt(ms) {
    var d = Math.floor(ms / 100) % 10;
    var s = Math.floor(ms / 1000) % 60;
    var m = Math.floor(ms / 60000) % 60;
    var h = Math.floor(ms / 3600000);
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return p(h) + ":" + p(m) + ":" + p(s) + "." + d;
  }

  var lastShown = null, raf = 0;
  function paintClock() {
    var str = fmt(elapsed());
    if (str === lastShown) return;   // most frames change nothing; do not touch the DOM
    lastShown = str;
    tval.textContent = str;
  }
  function paintState() {
    timerEl.dataset.running = t.running ? "1" : "0";
    tstate.textContent = t.running ? "running" : (t.base ? "paused" : "stopped");
  }
  function frame() {
    paintClock();
    raf = t.running ? requestAnimationFrame(frame) : 0;
  }
  function run() { if (t.running && !raf) raf = requestAnimationFrame(frame); }

  function save() { store.set("timer", t); }
  function toggle() {
    if (t.running) { t.base = elapsed(); t.running = false; }
    else { t.running = true; t.since = Date.now(); }
    anchor(); save(); paintState(); paintClock(); run();
  }
  function reset() {
    t = { running: false, base: 0, since: 0 };
    anchor(); save(); paintState(); paintClock();
  }

  timerEl.addEventListener("click", toggle);
  timerEl.addEventListener("contextmenu", function (ev) { ev.preventDefault(); reset(); });
  document.addEventListener("keydown", function (ev) {
    if (ev.target && /^(INPUT|TEXTAREA)$/.test(ev.target.tagName)) return;
    if (ev.code === "Space") { ev.preventDefault(); toggle(); }
    else if (ev.key === "r" || ev.key === "R") { reset(); }
  });
  timerEl.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") { ev.preventDefault(); toggle(); }
  });
  /* rAF stops while the page is hidden, so the digits are stale for one frame on the way back.
     elapsed() is computed from the anchor rather than accumulated, so it is still correct. */
  document.addEventListener("visibilitychange", function () { paintClock(); run(); });

  paintState(); paintClock(); run();
})();
</script>

</body>
</html>
